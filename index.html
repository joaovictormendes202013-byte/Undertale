<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sans</title>

<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        color: white;
        font-family: "Comic Sans MS", Comic Sans, cursive;
    }

    #container {
        text-align: center;
    }

    img {
        width: 250px;
        image-rendering: pixelated;
    }

    #texto {
        margin-top: 20px;
        font-size: 20px;
        max-width: 500px;
        min-height: 60px;
    }
</style>
</head>
<body>

<div id="container">
    <img src="sans.png" id="sans">
    <div id="texto"></div>
</div>

<script>

// frases
const frases = [
    "Está um dia lindo lá fora.",
    "Os pássaros cantam, as flores florescem...",
    "Em dias como estes, crianças como você..."
];

let i = 0;
const texto = document.getElementById("texto");
const sans = document.getElementById("sans");

// efeito de digitação
function digitar(textoCompleto, callback) {
    texto.innerText = "";
    let j = 0;

    function escrever() {
        if (j < textoCompleto.length) {
            texto.innerText += textoCompleto[j];
            j++;
            setTimeout(escrever, 60); // velocidade da digitação
        } else {
            setTimeout(callback, 1200);
        }
    }

    escrever();
}

// sequência de falas
function proximaFrase() {
    if (i < frases.length) {
        texto.style.color = "white";
        digitar(frases[i], () => {
            i++;
            proximaFrase();
        });
    } else {
        mensagemFinal();
    }
}

// final
function mensagemFinal() {

    // troca de sprite
    sans.src = "sans2.png";

    texto.style.color = "red";
    texto.style.fontSize = "24px";

    digitar("DEVERIAM QUEIMAR NO INFERNO", () => {});
}

// iniciar
setTimeout(proximaFrase, 1000);

</script>

</body>
</html>
