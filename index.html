<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sans</title>

<style>
body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    font-family: "Comic Sans MS", cursive;
    color: white;
}

img {
    width: 250px;
    image-rendering: pixelated;
}

#texto {
    margin-top: 20px;
    font-size: 20px;
    max-width: 500px;
    min-height: 60px;
    white-space: pre-wrap; /* garante espaços */
    text-align: center;
}
</style>
</head>
<body>

<img src="sans.png" id="sans">
<div id="texto"></div>

<script>

const frases = [
    "Está um dia lindo lá fora.",
    "Os pássaros cantam, as flores florescem...",
    "Em dias como estes, crianças como você..."
];

let i = 0;
const texto = document.getElementById("texto");
const sans = document.getElementById("sans");

// 🔊 som confiável
function playSound() {
    const audio = new Audio("type_sound.mp3");
    audio.volume = 0.3;
    audio.play().catch(() => {});
}

// ✍️ digitação CORRETA
function digitar(frase, callback) {

    texto.textContent = ""; // 🔥 IMPORTANTE
    let j = 0;

    function escrever() {
        if (j < frase.length) {

            const char = frase[j];

            texto.textContent += char; // 🔥 preserva espaço

            if (char !== " ") {
                playSound();
            }

            j++;
            setTimeout(escrever, 55);

        } else {
            setTimeout(callback, 1000);
        }
    }

    escrever();
}

// sequência
function proximaFrase() {
    if (i < frases.length) {

        texto.style.color = "white";

        digitar(frases[i], () => {
            i++;
            proximaFrase();
        });

    } else {
        final();
    }
}

// final
function final() {

    sans.src = "sans2.png";

    texto.style.color = "red";
    texto.style.fontSize = "24px";

    digitar("DEVERIAM QUEIMAR NO INFERNO", () => {});
}

// 🔥 START AUTOMÁTICO COM CLIQUE (OBRIGATÓRIO PRA SOM)
document.body.addEventListener("click", () => {
    proximaFrase();
}, { once: true });

</script>

</body>
</html>
