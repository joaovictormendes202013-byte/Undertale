<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sans</title>

<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        font-family: "Comic Sans MS", cursive;
        color: white;
    }

    img {
        width: 250px;
        image-rendering: pixelated;
    }

    #texto {
        margin-top: 20px;
        font-size: 20px;
        max-width: 500px;
        min-height: 60px;
        white-space: pre-wrap; /* 🔥 mantém espaços e quebras */
    }
</style>
</head>
<body>

<img src="sans.png" id="sans">
<div id="texto"></div>

<audio id="som" src="type_sound.mp3"></audio>

<script>

const frases = [
    "Está um dia lindo lá fora.",
    "Os pássaros cantam, as flores florescem...",
    "Em dias como estes, crianças como você..."
];

let i = 0;
const texto = document.getElementById("texto");
const som = document.getElementById("som");
const sans = document.getElementById("sans");

// digitação corrigida
function digitar(frase, callback) {
    texto.innerText = "";
    let j = 0;

    function escrever() {
        if (j < frase.length) {

            const char = frase[j];
            texto.innerText += char;

            // 🔊 som mais leve (evita bug)
            if (char !== " ") {
                som.currentTime = 0;
                som.play();
            }

            j++;
            setTimeout(escrever, 60);

        } else {
            setTimeout(callback, 1200);
        }
    }

    escrever();
}

// sequência
function proximaFrase() {
    if (i < frases.length) {

        texto.style.color = "white";

        digitar(frases[i], () => {
            i++;
            proximaFrase();
        });

    } else {
        final();
    }
}

// final vermelho + sprite trocado
function final() {

    sans.src = "sans2.png";

    texto.style.color = "red";
    texto.style.fontSize = "24px";

    digitar("DEVERIAM QUEIMAR NO INFERNO", () => {});
}

// start
setTimeout(proximaFrase, 1000);

</script>

</body>
</html>
